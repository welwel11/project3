# /etc/default/dropbear - Ubuntu 22+ compatible

# Enable Dropbear (set 0 to start, 1 to disable)
NO_START=0

# Default Dropbear port (tidak wajib kalau sudah pakai EXTRA_ARGS)
DROPBEAR_PORT=143

# Additional arguments (multi-port example)
# Bisa pakai lebih dari 1 port dengan -p
DROPBEAR_EXTRA_ARGS="-p 143 -p 109"

# Banner file
DROPBEAR_BANNER="/etc/kyt.txt"

# Host keys (otomatis dibuat jika tidak ada)
#DROPBEAR_RSAKEY="/etc/dropbear/dropbear_rsa_host_key"
#DROPBEAR_DSSKEY="/etc/dropbear/dropbear_dss_host_key"
#DROPBEAR_ECDSAKEY="/etc/dropbear/dropbear_ecdsa_host_key"

# Network performance tuning
DROPBEAR_RECEIVE_WINDOW=65536